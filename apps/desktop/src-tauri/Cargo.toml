[package]
name = "angkorgit"
version = "0.21.1"
description = "AngKorGit — a modern, fast, beautiful Git client"
authors = ["AngKorGit Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "angkorgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# vendored-openssl: the release pipeline cross-compiles (e.g. x86_64 half of
# the macOS universal binary) where no system OpenSSL exists for the target.
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
portable-pty = "0.8"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify-debouncer-mini = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
which = "7"
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
# The default WinCNG libssh2 backend cannot negotiate ssh-ed25519/ecdsa host
# keys, so libgit2's hostkey-preference setup fails outright ("failed to set
# hostkey preference") against servers like GitLab. Route the vendored libssh2
# through OpenSSL on Windows instead; this compiles OpenSSL from source and
# needs Perl available at build time.
libssh2-sys = { version = "0.3", features = ["openssl-on-win32", "vendored-openssl"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
